general {
    lock_cmd = ~/.config/scripts/hype-control lock-screen
    ignore_dbus_inhibit = false
}

listener {
    timeout = 60
    on-timeout = ~/.config/scripts/hype-control lock-screen
}

listener {
    timeout = 90
    on-timeout = ~/.config/scripts/hype-control monitors off
    on-resume = ~/.config/scripts/hype-control monitors on
}
