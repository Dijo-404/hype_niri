general {
    lock_cmd = ~/.config/scripts/hype-control lock-screen
    after_sleep_cmd = ~/.config/scripts/hype-control copilot-display resume
    ignore_dbus_inhibit = false
}

listener {
    timeout = 60
    on-timeout = loginctl lock-session
    on-resume = niri msg action power-on-monitors
}

listener {
    timeout = 90
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
