[package]
name = "hype-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "use-dev-tty"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
signal-hook = "0.3"
tempfile = "3"
