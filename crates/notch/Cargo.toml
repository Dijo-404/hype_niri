[package]
name = "hype-notch"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "hype-notch"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
gtk4-layer-shell = "0.8"
libpulse-binding = "2.30"
libc = "0.2"
serde_json = "1"
gio-unix = { version = "0.22", features = ["v2_58"] }
glib-unix = "0.22"
tempfile = "3"
